info:
  name: refresh
  type: http
  seq: 3

http:
  method: POST
  url: "{{localhost}}/api/v1/auth/refresh"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("token", res.body.accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
