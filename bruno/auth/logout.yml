info:
  name: logout
  type: http
  seq: 4

http:
  method: POST
  url: "{{localhost}}/api/v1/auth/logout"
  headers:
    - name: Bearer
      value: "{{token}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("token", '');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
