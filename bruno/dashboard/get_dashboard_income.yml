info:
  name: get_dashboard_income
  type: http
  seq: 1

http:
  method: GET
  url: "{{localhost}}/api/v1/dashboard/income?year=2026"
  params:
    - name: year
      value: "2026"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Auth: Authorization: Bearer <token>

  No transactions, no config

  GET /api/v1/dashboard/income?year=2025
  Expected: 200


  {
    "year": 2025,
    "months": [
      { "month": 1, "total": "0.00", "allocation": null },
      ...12 entries total, all "0.00" / null
    ]
  }
  Has income transactions, no percentages configured
  Import or create some income transactions for a given month, then:


  GET /api/v1/dashboard/income?year=2025
  Expected: 200 — the month with income shows its total, but allocation: null on every month.

  Has income transactions + percentages configured
  After PATCH /user-config with 50/30/20:


  GET /api/v1/dashboard/income?year=2025
  Expected: 200 — month with total: "4500.00" should show:


  {
    "month": 3,
    "total": "4500.00",
    "allocation": {
      "needs": "2250.00",
      "wants": "1350.00",
      "investments": "900.00"
    }
  }
  Months with no income and percentages configured should show allocation: { "needs": "0.00", "wants": "0.00", "investments": "0.00" } (not null).

  Missing year

  GET /api/v1/dashboard/income
  Expected: 400

  Out-of-range year

  GET /api/v1/dashboard/income?year=1999
  Expected: 400

  No auth

  GET /api/v1/dashboard/income?year=2025  (no Authorization header)
  Expected: 401
