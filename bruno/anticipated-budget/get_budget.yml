info:
  name: get_budget
  type: http
  seq: 1

http:
  method: GET
  url: "{{localhost}}/api/v1/anticipated-budget?year=2025"
  params:
    - name: year
      value: "2025"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Happy path

  Input: ?year=2025, valid token
  Expected: 200, array of entries. Each entry has:
  id, name, categoryId, categoryName, categoryIcon, needWant, isIncome, monthlyAmount, notes, effectiveYear
  months: array of 12 objects { month: 1–12, amount: "...", isOverride: false }
  All months show monthlyAmount when no overrides exist
  With no entries for that year: 200, []
  Error cases

  Missing ?year: 400
  No auth token: 401
