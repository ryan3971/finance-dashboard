info:
  name: post_tag
  type: http
  seq: 2

http:
  method: POST
  url: "{{localhost}}/api/v1/tags"
  body:
    type: json
    data: |-
      {
        "name": "Groceries",
        "color": "#FF5733"  // Must be hex code
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
