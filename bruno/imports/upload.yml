info:
  name: upload
  type: http
  seq: 1

http:
  method: POST
  url: "{{localhost}}/api/v1/imports/upload"
  body:
    type: multipart-form
    data:
      - name: accountId
        type: text
        value: "{{tdAccountId}}"
        contentType: Text
      - name: file
        type: text
        value: ""
        contentType: File
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
