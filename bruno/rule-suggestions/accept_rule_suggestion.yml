#   needWant, flagForReview, priority, matchType, sourceName, createdAt,
#   retroactivelyApplied: number   ← transactions updated in the same request
# }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
